name: 'Automate BAckup file copy to AWS S3'
description: 'Deploy backup files, from backup directory to bucket'
inputs:
  bucket:
    description: 'The S3 bucket name'
    required: true
  bucket_region:
     description: 'Region of the S3 bucket'
     required: false
     default: 'us-east-1'
  dist-folder:
     description: 'Folder containing the backup files.'
     required: true
runs:
  using: docker
  image: 'Dockerfile'   ## or official image.

